<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Healthtech Project</title>
  </head>
  <body>
    <div id="start-screen">
      <h1>Easing Pediatric Injections with Virtual Reality</h1>
      <p class="hint">Headphones recommended</p>
      <button id="start-btn">START EXPERIENCE</button>
      <p id="start-status"></p>
    </div>

    <div id="instructions" class="hidden">
      Look at a sphere for 1.5s to trigger it
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/webxr-polyfill@latest/build/webxr-polyfill.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
